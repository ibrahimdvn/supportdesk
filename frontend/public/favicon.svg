<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18142c" />
      <stop offset="100%" stop-color="#09070f" />
    </radialGradient>
    
    <!-- Neon Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#863bff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Ticket Fill Gradient -->
    <linearGradient id="ticketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#863bff" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Base Circle -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Outer Neon Radial Glow -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#borderGrad)" stroke-width="8" opacity="0.4" filter="url(#neonGlow)" />

  <!-- Stylized Premium Ticket Icon -->
  <g transform="translate(100, 100) scale(1.2)" filter="url(#neonGlow)">
    <!-- Main Ticket Body -->
    <path d="M 200 40 
             C 200 55, 180 65, 180 80 
             C 180 95, 200 105, 200 120 
             L 200 200 
             C 185 200, 175 220, 160 220 
             C 145 220, 135 200, 120 200 
             L 40 200 
             C 40 185, 20 175, 20 160 
             C 20 145, 40 135, 40 120 
             L 40 40 
             C 55 40, 65 20, 80 20 
             C 95 20, 105 40, 120 40 
             Z" 
          fill="url(#ticketGrad)" 
          stroke="url(#borderGrad)" 
          stroke-width="6" 
          stroke-linejoin="round"
          transform="translate(10, 15)" />

    <!-- SLA Ticket Notch Lines (Dotted Separator) -->
    <line x1="70" y1="115" x2="170" y2="115" stroke="#ffffff" stroke-width="6" stroke-dasharray="10 8" opacity="0.8" />

    <!-- Glowing SLA Center Star/Emblem -->
    <path d="M 120 155 L 125 170 L 140 170 L 128 180 L 132 195 L 120 185 L 108 195 L 112 180 L 100 170 L 115 170 Z" fill="#ffffff" opacity="0.9" />
  </g>
</svg>